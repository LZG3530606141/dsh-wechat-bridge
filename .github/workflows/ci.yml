name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check src/index.mjs
      - run: node --check src/wechat-media.mjs
      - run: node --check bin/dsh-wechat.mjs
      - run: npm test
      - name: Verify package allowlist
        run: npm pack --dry-run --json > pack.json
      - name: Check CLI entry points
        run: |
          node bin/dsh-wechat.mjs --version
          node bin/dsh-wechat.mjs --help > /dev/null
